name: Build & Release Portable

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download Node.exe Portable
        run: |
          mkdir -p build-portable
          curl -sL -f -o build-portable/node.exe https://nodejs.org/dist/v22.20.0/win-x64/node.exe
          SIZE=$(stat -c%s build-portable/node.exe)
          if [ "$SIZE" -lt 50000000 ]; then echo "❌ Download gagal"; exit 1; fi

      - name: Copy Project Files
        run: |
          mkdir -p build-portable/app
          # Menyesuaikan dengan file aplikasi ujian Anda
          cp server.js reset-guru.js package.json package-lock.json build-portable/app/
          cp -r public build-portable/app/

      - name: Install Dependencies & Cek Binary Windows
        run: |
          cd build-portable/app
          npm install --omit=dev --no-audit --no-fund 2>&1 | tail -5
          echo "=== Cek binary Windows better-sqlite3 ==="
          ls -la node_modules/better-sqlite3/prebuilds/
          if [ ! -f "node_modules/better-sqlite3/prebuilds/win32-x64.node" ]; then
            echo "❌ Binary Windows tidak ada!"; exit 1;
          fi

      - name: Create start.bat
        run: |
          cat > build-portable/start.bat << 'EOF'
          @echo off
          title Aplikasi Ujian Online
          cd /d "%~dp0"
          echo.
          echo  ========================================
          echo   APLIKASI UJIAN ONLINE
          echo  ========================================
          echo.
          echo  Server berjalan di: http://localhost:3000
          echo  Tekan Ctrl+C untuk mematikan server.
          echo.
          timeout /t 2 /nobreak >nul
          start "" http://localhost:3000
          node.exe app\server.js
          pause
          EOF

      - name: Create ZIP
        run: |
          cd build-portable
          zip -r -q -9 ../ujian-${{ github.ref_name }}.zip . \
            -x "*/node_modules/*/test/*" \
               "*/node_modules/*/tests/*" \
               "*/node_modules/*/docs/*" \
               "*/node_modules/*/*.md" \
               "*/node_modules/*/*.txt" \
               "*/node_modules/*/*.map" \
               "*/node_modules/*/*.d.ts" \
               "*/node_modules/*/.eslint*" \
               "*/node_modules/*/.editorconfig" \
               "*/node_modules/*/.travis.yml" \
               "*/node_modules/*/.github/*" \
               "*/node_modules/*/example/*" \
               "*/node_modules/*/examples/*" \
               "*/node_modules/.bin/*"
          cd ..
          echo "=== File ZIP hasil ==="
          ls -lh ujian-*.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/ujian-${{ github.ref_name }}.zip
          name: "Ujian Online ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## Aplikasi Ujian Online — ${{ github.ref_name }}

            ### 🚀 Cara Pakai
            1. Download `ujian-${{ github.ref_name }}.zip`
            2. Extract ke folder manapun di Windows
            3. Dobel-klik `start.bat`
            4. Browser otomatis terbuka di http://localhost:3000
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}