name: Build & Release Portable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Diperbaiki: Sesuaikan dengan package.json (>=24.0.0)

      - name: Download Node.exe Portable
        shell: bash
        run: |
          mkdir -p build-portable
          # Mengambil Node versi 24 terbaru secara dinamis
          curl -sL -f -o build-portable/node.exe https://nodejs.org/dist/latest-v24.x/win-x64/node.exe
          SIZE=$(stat -c%s build-portable/node.exe)
          if [ "$SIZE" -lt 50000000 ]; then echo "Download gagal"; exit 1; fi

      - name: Copy Project Files
        shell: bash
        run: |
          mkdir -p build-portable/app
          # package-lock.json dihilangkan agar npm install berjalan fresh dan tidak konflik OS
          cp server.js reset-guru.js package.json build-portable/app/
          cp -r public build-portable/app/

      - name: Install Dependencies & Cek Binary Windows
        shell: bash
        run: |
          cd build-portable/app
          npm install --omit=dev --no-audit --no-fund
          
          echo "=== Paksa unduh/bangun binary Windows ==="
          npm rebuild better-sqlite3
          
          echo "=== Cek lokasi binary better-sqlite3 ==="
          find node_modules/better-sqlite3 -name "*.node"
          
          # Diperbaiki: Mencari file .node di mana saja, bukan hanya di folder prebuilds
          if [ -z "$(find node_modules/better-sqlite3 -name '*.node')" ]; then
            echo "❌ Binary Windows tidak ada!"; exit 1;
          fi

      - name: Create start.bat
        shell: bash
        run: |
          cat > build-portable/start.bat << 'EOF'
          @echo off
          title Aplikasi Ujian Online
          cd /d "%~dp0"
          echo.
          echo  ========================================
          echo   APLIKASI UJIAN ONLINE
          echo  ========================================
          echo.
          echo  Server berjalan di: http://localhost:3000
          echo  Tekan Ctrl+C untuk mematikan server.
          echo.
          timeout /t 2 /nobreak >nul
          start "" http://localhost:3000
          node.exe app\server.js
          pause
          EOF

      - name: Create ZIP (Menggunakan 7z di Windows)
        shell: bash
        run: |
          cd build-portable
          7z a -r -tzip ../ujian-${{ github.ref_name }}.zip . \
            -xr!node_modules/*/test \
            -xr!node_modules/*/tests \
            -xr!node_modules/*/docs \
            -xr!node_modules/*/*.md \
            -xr!node_modules/*/*.txt \
            -xr!node_modules/*/*.map \
            -xr!node_modules/*/*.d.ts \
            -xr!node_modules/*/.eslint* \
            -xr!node_modules/*/.editorconfig \
            -xr!node_modules/*/.travis.yml \
            -xr!node_modules/*/.github \
            -xr!node_modules/*/example \
            -xr!node_modules/*/examples \
            -xr!node_modules/.bin
          cd ..
          echo "=== File ZIP hasil ==="
          ls -lh ujian-*.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/ujian-${{ github.ref_name }}.zip
          name: "Ujian Online ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## Aplikasi Ujian Online — ${{ github.ref_name }}

            ### Cara Pakai
            1. Download `ujian-${{ github.ref_name }}.zip`
            2. Extract ke folder manapun di Windows
            3. Dobel-klik `start.bat`
            4. Browser otomatis terbuka di http://localhost:3000
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}