<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Aplikasi Ujian</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f172a; color: #e2e8f0; font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; }
    .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .box { max-width: 340px; }
    .logo { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 10px; background: #10b981; color: #052e1b; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.6; color: #94a3b8; margin: 0; }
    code { color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="box">
      <div class="logo">U</div>
      <h1>Aplikasi Ujian</h1>
      <p>Server ujian belum diatur. Hubungi pengawas atau admin sekolah.</p>
      <p style="margin-top:12px">Atur <code>server.url</code> pada <code>capacitor.config.json</code> lalu build ulang APK.</p>
    </div>
  </div>
</body>
</html>
